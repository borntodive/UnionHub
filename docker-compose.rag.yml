version: "3.9"

# KB Python embedding service
# Start:  docker compose -f docker-compose.rag.yml up -d
# Stop:   docker compose -f docker-compose.rag.yml down
# Logs:   docker compose -f docker-compose.rag.yml logs -f python-rag
# Rebuild: docker compose -f docker-compose.rag.yml build --no-cache python-rag

services:
  python-rag:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: unionhub-python-rag
    ports:
      - "8001:8001"
    environment:
      - HF_HOME=/app/.cache
    volumes:
      # Model cache — persists across rebuilds (~1.5GB)
      - rag_model_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  rag_model_cache:
